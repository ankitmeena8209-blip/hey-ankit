<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1217" />
      <stop offset="100%" stop-color="#182029" />
    </linearGradient>

    <!-- Vibrant Teal / Mint Brand Gradient -->
    <linearGradient id="brandTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="brandCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="6" />

  <!-- Ambient Glow Behind Symbols -->
  <circle cx="200" cy="230" r="130" fill="#0D9488" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="310" cy="280" r="130" fill="#06B6D4" opacity="0.25" filter="url(#softGlow)" />

  <!-- Left Connected Loop (Chat Node 1) -->
  <path d="M 230 170 C 175 170, 130 215, 130 270 C 130 325, 175 370, 230 370 C 265 370, 296 352, 312 324 L 270 300 C 260 316, 246 324, 230 324 C 200 324, 176 300, 176 270 C 176 240, 200 216, 230 216 C 248 216, 263 225, 272 238 L 314 214 C 298 188, 266 170, 230 170 Z" fill="url(#brandTeal)" />

  <!-- Right Connected Loop (Chat Node 2 - Linked & Intersecting) -->
  <path d="M 282 142 C 246 142, 215 160, 199 188 L 241 212 C 251 196, 265 188, 282 188 C 312 188, 336 212, 336 242 C 336 272, 312 296, 282 296 C 264 296, 249 287, 240 274 L 198 298 C 214 324, 246 342, 282 342 C 337 342, 382 297, 382 242 C 382 187, 337 142, 282 142 Z" fill="url(#brandCyan)" />

  <!-- Fluid Connector Core Bridge -->
  <rect x="236" y="236" width="40" height="40" rx="20" fill="#F0FDFA" opacity="0.9" />
</svg>
